name: Build Release APK

# 推一個 v 開頭的版本標籤(例如 v0.3.0)就會自動 build APK 並建立 Release。
# 也可以到 Actions 分頁手動執行(workflow_dispatch)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # 建立 Release 需要寫入權限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版號以 git tag 為單一來源:推 vX.Y.Z 時用 tag 名;手動執行(無 tag)時 fallback
      # 回 build.gradle.kts 的 versionName。versionCode 由 semver 換算成單調遞增整數。
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          fi
          IFS='.' read -r MA MI PA <<< "$VERSION"
          CODE=$(( ${MA:-0}*10000 + ${MI:-0}*100 + ${PA:-0} ))
          [ "$CODE" -le 0 ] && CODE=1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # debug 簽章:用內建的 debug keystore 簽章,產出可直接安裝的 APK。
      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionName=${{ steps.ver.outputs.version }} -PversionCode=${{ steps.ver.outputs.code }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ThorLens-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThorLens-v${{ steps.ver.outputs.version }}
          path: dist/ThorLens-*.apk

      # 只有在「推標籤」時才建立 Release(手動執行只會產出上面的 artifact)。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ThorLens-*.apk
          generate_release_notes: true
